  <g><path d="M76 72v8M72 76h8"/><path d="M216 64v8M212 68h8"/><path d="M66 148v8M62 152h8"/><path d="M288 142v8M284 146h8"/><path d="M140 226v8M136 230h8"/><path d="M216 222v8M212 226h8"/><path d="M76 322v8M72 326h8"/><path d="M204 318v8M200 322h8"/><path d="M340 222v8M336 226h8"/><circle cx="144" cy="70" r="2.5"/><circle cx="282" cy="72" r="2.5"/><circle cx="150" cy="144" r="2.5"/><circle cx="24" cy="226" r="2.5"/><circle cx="276" cy="226" r="2.5"/><circle cx="140" cy="318" r="2.5"/><circle cx="330" cy="330" r="2.5"/><circle cx="20" cy="330" r="2.5"/></g>
