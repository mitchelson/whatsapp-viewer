  <!-- chat bubble 2 -->
  <g transform="translate(300 250) rotate(10)"><path d="M16 2c9 0 16 5.6 16 12.5S25 27 16 27c-2 0-4-.3-5.6-.8L3 30l2.4-6C2.4 21.7 0 18.3 0 14.5 0 7.6 7 2 16 2z"/></g>
